<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travelspiria</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap" rel="stylesheet" />
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/travelrec.css" />
</head>
<body>
  <main class="main-content">
    <div class="container">
      <h4 class="center-align">Travel Recommendations</h4>
      <form id="travelForm" class="row">
        <div class="input-field col s12 m8">
          <input id="location" type="text" required>
          <label for="location">Enter a Location (City, State, or Country)</label>
        </div>
        <div class="input-field col s12 m4">
          <button class="btn waves-effect waves-light" type="submit">Search</button>
        </div>
      </form>
      <div id="results" class="row"></div>
    </div>
  </main>

  <footer data-include="components/Dfooter.html" class="page-footer grey lighten-3"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="scripts/index.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/travelrec.js"></script>
  <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
