<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travelspiria</title>

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap" rel="stylesheet" />

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles/travelrec.css" />
</head>
<body>

  <main class="main-content">
    <div class="content-wrapper z-depth-1">
    <div class="container">
      <h4 class="center-align">Travel Recommendations</h4>

      <!-- Search Form -->
      <form id="travelForm" class="row">
        <div class="col s12">
          <div class="container" style="display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap;">
            
            <!-- Input Field -->
             <div class="search-wrapper">
            <input id="location" type="text" placeholder="Enter a Location (City, State, or Country)" required />
            <button class="btn search-btn" type="submit">
            <i class="material-icons">search</i>
            </button>
          </div>
          
          <!-- Only one checkbox here -->
          <div class="center-align" style="margin-top: 10px;">
            <label>
              <input type="checkbox" id="showWeather" class="filled-in" checked />
              <span>Show weather info</span>
            </label>
          </div>
        </div>
      </form>

      <!-- Weather Info -->
      <div id="weatherInfo" class="card-panel teal lighten-4" style="display: none; margin-bottom: 2rem;">
        <h5 class="black-text">Current Weather</h5>
        <div id="weatherDetails" class="black-text"></div>
      </div>

<div id="loadingSpinner" class="center-align" style="display: none; margin-top: 2rem;">
  <div class="preloader-wrapper active">
    <div class="spinner-layer spinner-blue-only">
      <div class="circle-clipper left"><div class="circle"></div></div>
      <div class="gap-patch"><div class="circle"></div></div>
      <div class="circle-clipper right"><div class="circle"></div></div>
    </div>
  </div>
</div>
      <!-- Error Message -->
      <div id="errorMessage" class="red-text center-align" style="display: none; margin-top: 1rem;">
        <p>Something went wrong. Please try again.</p>
      </div>

      <!-- Results Container -->
      <div id="results" class="row center-align" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer data-include="components/Dfooter.html" class="page-footer grey lighten-3"></footer>

  <!-- External Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="scripts/index.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/travelrec.js"></script>
  <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
